<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" width="1040" height="400" role="img" aria-labelledby="t d"><title id="t">Четыре шага работы</title><desc id="d">Разбор, диагностика, первый рабочий контур, сопровождение.</desc><rect width="1040" height="400" rx="16" fill="#0B162A"/><text x="32" y="44" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="500" fill="#38BDD8" text-anchor="start" letter-spacing="1.5">ПОРЯДОК РАБОТЫ</text><text x="32" y="72" font-family="Manrope, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#E8EEF4" text-anchor="start">Четыре шага. Следующий не начинается, пока не виден результат предыдущего</text><rect x="32" y="108" width="220" height="250" rx="12" fill="#122036" stroke="#38BDD8" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="62" cy="142" r="16" fill="none" stroke="#38BDD8" stroke-width="2"/><text x="62" y="148" font-family="Manrope, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#38BDD8" text-anchor="middle">1</text><text x="88" y="148" font-family="Manrope, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#E8EEF4" text-anchor="start">Разбор</text><text x="50" y="184" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="500" fill="#7DCEA0" text-anchor="start">15 минут, бесплатно</text><text x="50" y="214" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">Один процесс, один созвон.</text><text x="50" y="233" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">Есть ли что считать.</text><path d="M50 298 H234" stroke="#38BDD8" stroke-opacity=".25"/><text x="50" y="320" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="500" fill="#38BDD8" text-anchor="start" letter-spacing="1.2">ВЫ ПОЛУЧАЕТЕ</text><text x="50" y="340" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#E8EEF4" text-anchor="start">Решение: идём или нет</text><path d="M255 233 H281" stroke="#7DCEA0" stroke-width="2"/><circle cx="268.0" cy="233" r="9" fill="#0B162A" stroke="#7DCEA0" stroke-width="2"/><path d="M264.0 233 l3 3 l5 -6" stroke="#7DCEA0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="284" y="108" width="220" height="250" rx="12" fill="#122036" stroke="#38BDD8" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="314" cy="142" r="16" fill="none" stroke="#38BDD8" stroke-width="2"/><text x="314" y="148" font-family="Manrope, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#38BDD8" text-anchor="middle">2</text><text x="340" y="148" font-family="Manrope, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#E8EEF4" text-anchor="start">Диагностика</text><text x="302" y="184" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="500" fill="#7DCEA0" text-anchor="start">5 рабочих дней</text><text x="302" y="214" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">Карта процесса, потери</text><text x="302" y="233" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">в часах и рублях,</text><text x="302" y="252" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">три гипотезы.</text><path d="M302 298 H486" stroke="#38BDD8" stroke-opacity=".25"/><text x="302" y="320" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="500" fill="#38BDD8" text-anchor="start" letter-spacing="1.2">ВЫ ПОЛУЧАЕТЕ</text><text x="302" y="340" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#E8EEF4" text-anchor="start">Отчёт и страница решения</text><path d="M507 233 H533" stroke="#7DCEA0" stroke-width="2"/><circle cx="520.0" cy="233" r="9" fill="#0B162A" stroke="#7DCEA0" stroke-width="2"/><path d="M516.0 233 l3 3 l5 -6" stroke="#7DCEA0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="536" y="108" width="220" height="250" rx="12" fill="#122036" stroke="#38BDD8" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="566" cy="142" r="16" fill="none" stroke="#38BDD8" stroke-width="2"/><text x="566" y="148" font-family="Manrope, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#38BDD8" text-anchor="middle">3</text><text x="592" y="148" font-family="Manrope, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#E8EEF4" text-anchor="start">Первый контур</text><text x="554" y="184" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="500" fill="#7DCEA0" text-anchor="start">10–14 рабочих дней</text><text x="554" y="214" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">Правило, связка систем</text><text x="554" y="233" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">или ассистент.</text><text x="554" y="252" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">Срок фиксируем до старта.</text><path d="M554 298 H738" stroke="#38BDD8" stroke-opacity=".25"/><text x="554" y="320" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="500" fill="#38BDD8" text-anchor="start" letter-spacing="1.2">ВЫ ПОЛУЧАЕТЕ</text><text x="554" y="340" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#E8EEF4" text-anchor="start">Инструмент и инструкция</text><path d="M759 233 H785" stroke="#7DCEA0" stroke-width="2"/><circle cx="772.0" cy="233" r="9" fill="#0B162A" stroke="#7DCEA0" stroke-width="2"/><path d="M768.0 233 l3 3 l5 -6" stroke="#7DCEA0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="788" y="108" width="220" height="250" rx="12" fill="#122036" stroke="#38BDD8" stroke-width="1.5" stroke-opacity="0.7"/><circle cx="818" cy="142" r="16" fill="none" stroke="#38BDD8" stroke-width="2"/><text x="818" y="148" font-family="Manrope, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#38BDD8" text-anchor="middle">4</text><text x="844" y="148" font-family="Manrope, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#E8EEF4" text-anchor="start">Сопровождение</text><text x="806" y="184" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="500" fill="#7DCEA0" text-anchor="start">по результату</text><text x="806" y="214" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">Мониторинг, исправление</text><text x="806" y="233" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">сбоев, доработки.</text><text x="806" y="252" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">Следующий процесс —</text><text x="806" y="271" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">после эффекта.</text><path d="M806 298 H990" stroke="#38BDD8" stroke-opacity=".25"/><text x="806" y="320" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="500" fill="#38BDD8" text-anchor="start" letter-spacing="1.2">ВЫ ПОЛУЧАЕТЕ</text><text x="806" y="340" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#E8EEF4" text-anchor="start">Журнал и доработки</text><text x="32" y="382" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#9AA8B8" text-anchor="start">Зелёная отметка: результат предыдущего шага принят, можно переходить дальше. Один ответственный на всех шагах: руководитель проекта.</text></svg>