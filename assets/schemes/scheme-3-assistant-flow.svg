<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" width="1040" height="440" role="img" aria-labelledby="t d"><title id="t">Сценарий ассистента</title><desc id="d">Вопрос клиента проходит проверку и поиск по регламентам; сложные случаи передаются оператору.</desc><rect width="1040" height="440" rx="16" fill="#0B162A"/><text x="32" y="44" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="500" fill="#38BDD8" text-anchor="start" letter-spacing="1.5">КЕЙС · СЦЕНАРИЙ АССИСТЕНТА</text><text x="32" y="72" font-family="Manrope, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#E8EEF4" text-anchor="start">Что происходит с вопросом клиента</text><rect x="32" y="112" width="220" height="100" rx="12" fill="#122036" stroke="#38BDD8" stroke-width="1.5" stroke-opacity="0.9"/><text x="48" y="146" font-family="Manrope, 'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#E8EEF4" text-anchor="start">Вопрос клиента</text><text x="48" y="170" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">в Telegram</text><rect x="284" y="112" width="220" height="100" rx="12" fill="#122036" stroke="#38BDD8" stroke-width="1.5" stroke-opacity="0.9"/><text x="300" y="146" font-family="Manrope, 'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#E8EEF4" text-anchor="start">Проверка</text><text x="300" y="170" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">запрещённые грузы</text><text x="300" y="189" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">до обращения к модели</text><rect x="536" y="112" width="220" height="100" rx="12" fill="#122036" stroke="#38BDD8" stroke-width="1.5" stroke-opacity="0.9"/><text x="552" y="146" font-family="Manrope, 'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#E8EEF4" text-anchor="start">Поиск ответа</text><text x="552" y="170" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">по базе из 15</text><text x="552" y="189" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">регламентов</text><rect x="788" y="112" width="220" height="100" rx="12" fill="#122036" stroke="#7DCEA0" stroke-width="1.5" stroke-opacity="0.9"/><text x="804" y="146" font-family="Manrope, 'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#E8EEF4" text-anchor="start">Ответ</text><text x="804" y="170" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">с документом</text><text x="804" y="189" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">и разделом</text><path d="M254 162 L280 162" stroke="#38BDD8" stroke-width="2" fill="none"/><path d="M272 157 L280 162 L272 167" stroke="#38BDD8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M506 162 L532 162" stroke="#38BDD8" stroke-width="2" fill="none"/><path d="M524 157 L532 162 L524 167" stroke="#38BDD8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M758 162 L784 162" stroke="#38BDD8" stroke-width="2" fill="none"/><path d="M776 157 L784 162 L776 167" stroke="#38BDD8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="284" y="270" width="220" height="108" rx="12" fill="#122036" stroke="#9AA8B8" stroke-width="1.5" stroke-opacity="0.9" stroke-dasharray="5 4"/><text x="300" y="302" font-family="Manrope, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#E8EEF4" text-anchor="start">Запрещённый груз</text><text x="300" y="324" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">Отказ с пояснением,</text><text x="300" y="342" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">модель не вызывается</text><rect x="536" y="270" width="220" height="108" rx="12" fill="#122036" stroke="#9AA8B8" stroke-width="1.5" stroke-opacity="0.9" stroke-dasharray="5 4"/><text x="552" y="302" font-family="Manrope, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#E8EEF4" text-anchor="start">Вопрос вне темы</text><text x="552" y="324" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">Вежливый отказ,</text><text x="552" y="342" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">возврат к теме</text><rect x="788" y="270" width="220" height="108" rx="12" fill="#122036" stroke="#7DCEA0" stroke-width="1.5" stroke-opacity="0.9" stroke-dasharray="5 4"/><text x="804" y="302" font-family="Manrope, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#E8EEF4" text-anchor="start">Сложный случай</text><text x="804" y="324" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">Претензия, исключение,</text><text x="804" y="342" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">смена роли ассистента:</text><text x="804" y="360" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">передача оператору</text><path d="M394 216 L380 264" stroke="#9AA8B8" stroke-width="2" fill="none" stroke-dasharray="4 4"/><path d="M375 256 L380 264 L385 256" stroke="#9AA8B8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M646 216 L618 264" stroke="#9AA8B8" stroke-width="2" fill="none" stroke-dasharray="4 4"/><path d="M613 256 L618 264 L623 256" stroke="#9AA8B8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M898 216 L856 264" stroke="#7DCEA0" stroke-width="2" fill="none" stroke-dasharray="4 4"/><path d="M851 256 L856 264 L861 256" stroke="#7DCEA0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="330" font-family="Manrope, 'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#7DCEA0" text-anchor="start">Сотрудник остаётся</text><text x="32" y="354" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">за решением по деньгам</text><text x="32" y="373" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">и условиям перевозки.</text><path d="M32 412 H1008" stroke="#38BDD8" stroke-opacity=".25"/><text x="32" y="432" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#9AA8B8" text-anchor="start">Тестовый проект на открытых регламентах. 10 из 10 сценариев чек-листа, ответ за 2–3 секунды (прогон 21.07.2026).</text></svg>