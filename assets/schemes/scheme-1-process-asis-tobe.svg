<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" role="img" aria-labelledby="t d"><title id="t">Схема процесса: как есть и как может стать</title><desc id="d">Сравнение процесса обработки заявки: ручной путь и путь с ассистентом, где решение остаётся за менеджером.</desc><rect width="1040" height="640" rx="16" fill="#0B162A"/><text x="32" y="44" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="500" fill="#38BDD8" text-anchor="start" letter-spacing="1.5">ПРИМЕР ПРОЦЕССА · ЗАЯВКА НА ПЕРЕВОЗКУ</text><text x="32" y="72" font-family="Manrope, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#E8EEF4" text-anchor="start">Как есть и как может стать после первого контура</text><text x="32" y="104" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="500" fill="#9AA8B8" text-anchor="start" letter-spacing="1.5">КАК ЕСТЬ</text><rect x="32" y="118" width="220" height="104" rx="12" fill="#122036" stroke="#9AA8B8" stroke-width="1.5" stroke-opacity="0.9" stroke-dasharray="5 4"/><text x="46" y="146" font-family="Manrope, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#E8EEF4" text-anchor="start">Заявка пришла</text><text x="46" y="168" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">письмо, чат,</text><text x="46" y="186" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">звонок</text><text x="46" y="212" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#9AA8B8" text-anchor="start">вручную</text><path d="M256 170 L278 170" stroke="#9AA8B8" stroke-width="2" fill="none"/><path d="M270 165 L278 170 L270 175" stroke="#9AA8B8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="284" y="118" width="220" height="104" rx="12" fill="#122036" stroke="#9AA8B8" stroke-width="1.5" stroke-opacity="0.9" stroke-dasharray="5 4"/><text x="298" y="146" font-family="Manrope, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#E8EEF4" text-anchor="start">Ввод параметров</text><text x="298" y="168" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">менеджер переносит</text><text x="298" y="186" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">данные в таблицу</text><text x="298" y="212" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#9AA8B8" text-anchor="start">вручную</text><path d="M508 170 L530 170" stroke="#9AA8B8" stroke-width="2" fill="none"/><path d="M522 165 L530 170 L522 175" stroke="#9AA8B8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="536" y="118" width="220" height="104" rx="12" fill="#122036" stroke="#9AA8B8" stroke-width="1.5" stroke-opacity="0.9" stroke-dasharray="5 4"/><text x="550" y="146" font-family="Manrope, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#E8EEF4" text-anchor="start">Расчёт в Excel</text><text x="550" y="168" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">ставка собирается</text><text x="550" y="186" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">вручную</text><text x="550" y="212" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#9AA8B8" text-anchor="start">вручную</text><path d="M760 170 L782 170" stroke="#9AA8B8" stroke-width="2" fill="none"/><path d="M774 165 L782 170 L774 175" stroke="#9AA8B8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="788" y="118" width="220" height="104" rx="12" fill="#122036" stroke="#9AA8B8" stroke-width="1.5" stroke-opacity="0.9" stroke-dasharray="5 4"/><text x="802" y="146" font-family="Manrope, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#E8EEF4" text-anchor="start">Ответ клиенту</text><text x="802" y="168" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">письмом, после</text><text x="802" y="186" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">проверки</text><text x="802" y="212" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#9AA8B8" text-anchor="start">вручную</text><text x="32" y="284" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="500" fill="#7DCEA0" text-anchor="start" letter-spacing="1.5">КАК МОЖЕТ СТАТЬ</text><rect x="32" y="298" width="220" height="104" rx="12" fill="#122036" stroke="#9AA8B8" stroke-width="1.5" stroke-opacity="0.9" stroke-dasharray="5 4"/><text x="46" y="326" font-family="Manrope, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#E8EEF4" text-anchor="start">Заявка пришла</text><text x="46" y="348" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">письмо, чат,</text><text x="46" y="366" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">звонок</text><text x="46" y="392" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#9AA8B8" text-anchor="start">вручную</text><path d="M256 350 L278 350" stroke="#7DCEA0" stroke-width="2" fill="none"/><path d="M270 345 L278 350 L270 355" stroke="#7DCEA0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="284" y="298" width="220" height="104" rx="12" fill="#122036" stroke="#7DCEA0" stroke-width="1.5" stroke-opacity="0.9"/><text x="298" y="326" font-family="Manrope, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#E8EEF4" text-anchor="start">Карточка заявки</text><text x="298" y="348" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">параметры собраны</text><text x="298" y="366" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">автоматически</text><text x="298" y="392" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#7DCEA0" text-anchor="start">ассистент / правило</text><path d="M508 350 L530 350" stroke="#7DCEA0" stroke-width="2" fill="none"/><path d="M522 345 L530 350 L522 355" stroke="#7DCEA0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="536" y="298" width="220" height="104" rx="12" fill="#122036" stroke="#7DCEA0" stroke-width="1.5" stroke-opacity="0.9"/><text x="550" y="326" font-family="Manrope, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#E8EEF4" text-anchor="start">Расчёт по тарифу</text><text x="550" y="348" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">по вашим</text><text x="550" y="366" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">тарифам</text><text x="550" y="392" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#7DCEA0" text-anchor="start">ассистент / правило</text><path d="M760 350 L782 350" stroke="#7DCEA0" stroke-width="2" fill="none"/><path d="M774 345 L782 350 L774 355" stroke="#7DCEA0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="788" y="298" width="220" height="104" rx="12" fill="#122036" stroke="#9AA8B8" stroke-width="1.5" stroke-opacity="0.9" stroke-dasharray="5 4"/><text x="802" y="326" font-family="Manrope, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#E8EEF4" text-anchor="start">Проверка и отправка</text><text x="802" y="348" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">менеджер проверяет</text><text x="802" y="366" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">и решает</text><text x="802" y="392" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="500" fill="#9AA8B8" text-anchor="start">вручную</text><text x="32" y="252" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">Потери: ожидание ответа, повторный ввод, ошибки переноса</text><text x="32" y="432" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#7DCEA0" text-anchor="start">Решение и отправка остаются за менеджером. Система ведёт журнал.</text><text x="32" y="470" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="500" fill="#38BDD8" text-anchor="start" letter-spacing="1.5">ДАЛЬШЕ · ТОЛЬКО ПОСЛЕ РЕЗУЛЬТАТА ПЕРВОГО КОНТУРА</text><rect x="32" y="486" width="308" height="82" rx="12" fill="none" stroke="#38BDD8" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="2 5"/><text x="48" y="514" font-family="Manrope, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#E8EEF4" text-anchor="start">Передача в TMS или CRM</text><text x="48" y="536" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">Карточка заявки уходит в вашу</text><text x="48" y="554" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">систему без повторного ввода.</text><rect x="366" y="486" width="308" height="82" rx="12" fill="none" stroke="#38BDD8" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="2 5"/><text x="382" y="514" font-family="Manrope, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#E8EEF4" text-anchor="start">Новые каналы и форматы</text><text x="382" y="536" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">Вложения, сканы запросов,</text><text x="382" y="554" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">голосовые сообщения.</text><rect x="700" y="486" width="308" height="82" rx="12" fill="none" stroke="#38BDD8" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="2 5"/><text x="716" y="514" font-family="Manrope, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#E8EEF4" text-anchor="start">Типовые заявки по правилам</text><text x="716" y="536" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">Отправка по порогу маржи,</text><text x="716" y="554" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9AA8B8" text-anchor="start">менеджер получает уведомление.</text><rect x="32" y="584" width="976" height="44" rx="8" fill="none" stroke="#38BDD8" stroke-width="1.5" stroke-opacity="0.45" stroke-dasharray="3 4"/><text x="46" y="603" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#9AA8B8" text-anchor="start">Схема-пример: показывает формат разбора, это не результат конкретного клиента.</text><text x="46" y="619" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#9AA8B8" text-anchor="start">В отчёте диагностики каждая цифра получает пометку: измерено, рассчитано, оценка или неизвестно.</text></svg>